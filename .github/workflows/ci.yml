name: CI

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Debug workspace layout
        run: |
          set -x
          node -v
          npm -v
          ls -la node_modules/vitest 2>&1 | head -3 || echo "no vitest at root"
          ls -la node_modules/zod 2>&1 | head -3 || echo "no zod at root"
          ls -la packages/schema/node_modules 2>&1 || echo "no schema/node_modules"
          ls -la packages/core/node_modules 2>&1 || echo "no core/node_modules"
          node -e "console.log('vitest:', require.resolve('vitest', { paths: [process.cwd()+'/packages/schema']}))" 2>&1 || echo "vitest not resolvable from schema"
          node -e "console.log('zod:', require.resolve('zod', { paths: [process.cwd()+'/packages/schema']}))" 2>&1 || echo "zod not resolvable from schema"
      - name: Typecheck (schema + core only; site typecheck is `astro check`, run locally)
        run: |
          npm run typecheck -w @knowledge-test/schema
          npm run typecheck -w @knowledge-test/core
      - run: npm test
      - run: npm run validate:demo
      - run: npm run build:demo
