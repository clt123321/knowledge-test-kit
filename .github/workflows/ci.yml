name: CI

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Typecheck (schema + core only; site typecheck is `astro check`, run locally)
        run: |
          npm run typecheck -w @knowledge-test/schema
          npm run typecheck -w @knowledge-test/core
      - run: npm test
      - run: npm run validate:demo
      - run: npm run build:demo
